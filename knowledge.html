<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人知识库｜龙湘玉 Portfolio</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="knowledge-page">
    <main class="knowledge-page-main">
      <a class="article-back-link" href="./index.html#knowledge" aria-label="返回首页">返回</a>

      <section class="knowledge-page-hero" aria-label="个人知识库介绍">
        <p class="knowledge-article-eyebrow">个人知识库</p>
        <h1>个人知识库</h1>
        <p>记录设计、前端、AI 与个人创作过程中的一些思考。</p>
      </section>

      <section class="knowledge-page-panel" aria-label="文章筛选和排序">
        <div class="knowledge-page-toolbar">
          <div class="knowledge-filter-group" data-knowledge-filters aria-label="文章分类筛选"></div>
          <label class="knowledge-sort-control">
            <span>排序</span>
            <select data-knowledge-sort>
              <option value="newest">最新优先</option>
              <option value="oldest">最早优先</option>
              <option value="title">标题 A-Z</option>
            </select>
          </label>
        </div>

        <div class="knowledge-page-count" data-knowledge-count>正在加载文章...</div>
        <div class="knowledge-page-list" data-knowledge-list></div>
      </section>
    </main>

    <div class="floating-dock article-floating-dock" aria-label="AI 对话和当前页面">
      <button class="floating-dock-ai" type="button" aria-controls="ai-chat-sidebar" aria-expanded="false" data-ai-chat-toggle>
        <svg class="floating-dock-ai-spark" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2.4 14.8 9.2 21.6 12 14.8 14.8 12 21.6 9.2 14.8 2.4 12 9.2 9.2 12 2.4Z" />
        </svg>
        <img class="floating-dock-ai-logo" src="./assets/Longgggg.png" alt="Longgggg" />
      </button>
      <div class="floating-dock-location" aria-live="polite">
        <span class="floating-dock-location-current" data-page-indicator>个人知识库</span>
      </div>
    </div>

    <aside class="ai-chat-sidebar" id="ai-chat-sidebar" aria-hidden="true" data-ai-chat-sidebar>
      <div class="ai-chat-shell">
        <div class="ai-chat-header">
          <div>
            <h2>Ask Long</h2>
          </div>
          <button class="ai-chat-close" type="button" aria-label="关闭 AI 对话窗口" data-ai-chat-close>
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </div>

        <div class="ai-chat-messages" aria-live="polite" data-ai-chat-messages></div>

        <div class="ai-chat-starters" data-ai-chat-starters aria-label="推荐问题">
          <button type="button" data-ai-chat-starter="生活中的你是什么样的人？">生活中的你是什么样？</button>
          <button type="button" data-ai-chat-starter="和你一起工作会是什么感觉？">和你合作是什么感觉？</button>
          <button type="button" data-ai-chat-starter="你的设计思考方式是什么？">你如何思考设计？</button>
        </div>

        <form class="ai-chat-form" data-ai-chat-form>
          <label class="sr-only" for="knowledge-ai-chat-input">输入你想问龙湘玉 AI 分身的问题</label>
          <textarea
            class="ai-chat-input"
            id="knowledge-ai-chat-input"
            name="message"
            rows="1"
            maxlength="800"
            placeholder="你想了解我的哪些项目？"
            data-ai-chat-input
          ></textarea>
          <div class="ai-chat-actions">
            <button class="ai-chat-send" type="submit" data-ai-chat-send>发送</button>
          </div>
        </form>
      </div>
    </aside>

    <script src="./script.js"></script>
    <script src="./knowledge.js"></script>
  </body>
</html>
